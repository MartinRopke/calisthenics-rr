<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Treino RR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F3F5;
  --surface: #FFFFFF;
  --ink: #14263A;
  --ink2: #3F5268;
  --muted: #50647A;
  --line: #D6DCE2;
  --accent: #0B6FB0;
  --accent-ink: #FFFFFF;
  --accent-deep: #084F7D;
  --lvl: #B85700;
  --lvl-ink: #FFFFFF;
  --danger: #B3402F;
  --shadow: 0 -8px 30px rgba(20, 38, 58, .18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181D;
    --surface: #1F252C;
    --ink: #EEF4FB;
    --ink2: #B9C8DA;
    --muted: #9CB0C6;
    --line: #353E48;
    --accent: #1CB0F6;
    --accent-ink: #04202F;
    --accent-deep: #1480B8;
    --lvl: #FF9600;
    --lvl-ink: #2E1800;
    --danger: #FF8F7E;
    --shadow: 0 -8px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.45; font-stretch: 100%;
  padding-top: env(safe-area-inset-top);
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

.num { font-stretch: 68%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.wrap { max-width: 520px; margin: 0 auto; padding: 18px 20px calc(96px + env(safe-area-inset-bottom)); }
.page-head { padding: 10px 0 14px; }
.page-head h1 { font-stretch: 75%; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -.01em; }
.page-head p { color: var(--muted); margin-top: 6px; }
.page-head p.date::first-letter { text-transform: uppercase; }

.hint { padding: 12px 14px; background: var(--surface); border-left: 5px solid var(--line); margin: 6px 0 14px; font-size: 15px; }
.hint.go { border-left-color: var(--accent); }

.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; width: 100%; padding: 0 18px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; text-align: center; }
.btn.tape { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.btn.tape:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.small { min-height: 44px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.btn-row .btn { flex: 1; }

.week { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; }
.week .pips { display: flex; gap: 6px; }
.pip { width: 26px; height: 10px; border-radius: 2px; border: 2px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--accent); }

.sec-title { font-stretch: 80%; font-weight: 700; font-size: 22px; margin: 26px 0 4px; }

.ex-list { border-top: 2px solid var(--ink); }
.grp { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 22px 0 6px; }
.grp h3 { font-stretch: 85%; font-weight: 800; font-size: 18px; }
.ex { display: block; width: 100%; padding: 14px 0 13px; border-bottom: 1px solid var(--line); }
.ex-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ex-name { font-weight: 700; font-size: 18px; }
.ex-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.ex-equip { color: var(--ink2); font-size: 14px; margin-top: 4px; }
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 4px; }
.ex-target { font-size: 24px; white-space: nowrap; }
.ex-target small { font-stretch: 100%; font-weight: 600; font-size: 13px; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.ex.off .ex-name, .ex.off .ex-target { color: var(--muted); }
.ex-name { overflow-wrap: anywhere; }

.rungs { display: flex; gap: 3px; margin-top: 9px; align-items: flex-end; height: 14px; }
.rung { flex: 1; max-width: 34px; height: 6px; border-radius: 2px; border: 2px solid var(--line); }
.rung.done { background: var(--accent); border-color: var(--accent); }
.rung.cur { height: 14px; background: var(--accent); border-color: var(--accent); }

/* Barra de abas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tab { flex: 1; text-align: center; padding: 15px 0 13px; font-weight: 600; color: var(--muted); border-top: 4px solid transparent; margin-top: -1px; }
.tab[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }

/* Folha inferior */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 14, 16, .55); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); z-index: 31; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 14px; }
.sheet h2 { font-stretch: 78%; font-weight: 800; font-size: 30px; line-height: 1.05; }
.sheet h3 { font-stretch: 85%; font-weight: 700; font-size: 18px; margin: 20px 0 6px; }
.sheet ul.bul { padding-left: 0; }
.sheet ul.bul li { padding: 5px 0 5px 18px; position: relative; }
.sheet ul.bul li::before { content: ''; position: absolute; left: 0; top: 14px; width: 8px; height: 3px; background: var(--ink); }
.chip { display: inline-block; margin-top: 10px; padding: 6px 10px; border-radius: 6px; background: var(--bg); font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; }
.note { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-left: 4px solid var(--lvl); font-size: 14px; }

.ladder { border-top: 2px solid var(--ink); }
.ladder button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ladder .mark { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--line); flex: none; }
.ladder .done .mark { background: var(--ink); border-color: var(--ink); }
.ladder .cur .mark { background: var(--accent); border-color: var(--accent); }
.ladder .cur { font-weight: 700; }
.ladder .lock { color: var(--muted); }
.pathsel { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pathsel button { padding: 9px 12px; border-radius: 8px; border: 2px solid var(--line); font-size: 15px; }
.pathsel button[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }

/* Gráficos */
.chart-box { margin-top: 8px; }
.chart-cap { min-height: 22px; font-size: 14px; color: var(--ink2); margin-top: 4px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar path { fill: var(--accent); }
.chart .bar.up path { fill: var(--lvl); }
.chart .bar.sel path { stroke: var(--ink); stroke-width: 2px; }
.chart .base { stroke: var(--ink); stroke-width: 1.5px; }
.chart .goal { stroke: var(--muted); stroke-width: 1.5px; stroke-dasharray: 4 4; }
.chart text { fill: var(--ink2); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
.chart .bar { cursor: pointer; }

.pcard { padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
.pcard:first-of-type { border-top: 2px solid var(--ink); }
.pcard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pcard h3 { font-weight: 700; font-size: 18px; }

details.sess { border-bottom: 1px solid var(--line); padding: 12px 0; }
details.sess summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; list-style: none; }
details.sess summary::-webkit-details-marker { display: none; }
details.sess ul { margin-top: 8px; }
details.sess li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 15px; }
details.sess li span:last-child { color: var(--ink2); text-align: right; }
.up-tag { background: var(--lvl); color: var(--lvl-ink); padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-left: 6px; }

/* Ajustes */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row p { font-size: 14px; color: var(--muted); }
.switch { width: 56px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--surface); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(24px); background: var(--accent); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); font-size: 22px; text-align: center; }
.stepper .val { min-width: 54px; text-align: center; font-size: 22px; }
textarea { width: 100%; min-height: 110px; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; }

/* Treino em andamento */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.w-top { display: flex; align-items: center; gap: 12px; padding: 10px 14px; max-width: 520px; width: 100%; margin: 0 auto; }
.w-x { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); text-align: center; font-size: 22px; line-height: 40px; flex: none; }
.w-head { max-width: 520px; width: 100%; margin: 0 auto; }
.w-head .w-top { padding-bottom: 2px; }
.no-scroll { overflow: hidden; }
.w-body { scrollbar-width: none; }
.w-body::-webkit-scrollbar { display: none; }
.overlay { overscroll-behavior: contain; }

.w-segs { flex: 1; display: flex; gap: 2px; }
.w-segs i { flex: 1; height: 4px; border-radius: 1px; background: var(--line); }
.w-segs i.done { background: var(--accent); }
.w-segs i.cur { background: var(--accent-deep); }
.w-prog { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.w-prog i { display: block; height: 100%; background: var(--accent); }
.w-count { font-size: 14px; color: var(--muted); min-width: 44px; text-align: left; }
.w-top { gap: 12px; }
.w-body { flex: 1; overflow: auto; overscroll-behavior: contain; max-width: 520px; width: 100%; margin: 0 auto; padding: 6px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
.w-group { color: var(--muted); font-weight: 600; }
.w-name { font-stretch: 72%; font-weight: 800; font-size: 46px; line-height: 1; margin: 6px 0 4px; letter-spacing: -.01em; }
.w-sub { color: var(--muted); }
.sets { display: flex; gap: 6px; margin: 16px 0 0; }
.sets i { flex: 1; height: 10px; border-radius: 2px; border: 2px solid var(--line); }
.sets i.done { background: var(--accent); border-color: var(--accent); }
.sets i.cur { background: var(--accent); border-color: var(--accent); }
.w-target { margin: 22px 0 6px; display: flex; align-items: baseline; gap: 10px; }
.w-target .num { font-size: 88px; }
.w-target span:last-child { color: var(--muted); font-weight: 600; }
.w-cue { padding: 10px 12px; background: var(--surface); border-left: 5px solid var(--line); margin: 8px 0 16px; }
.big-stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.big-stepper button { width: 76px; height: 76px; border-radius: 14px; border: 2px solid var(--line); font-size: 34px; text-align: center; flex: none; }
.big-stepper .val { flex: 1; text-align: center; font-size: 64px; }
.swap { margin-top: 18px; }
.swap .pathsel { margin-top: 8px; }
.w-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.w-links button { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); color: var(--ink); font-weight: 700; font-size: 16px; }
.w-links button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.sides { display: flex; gap: 8px; margin: 16px 0 6px; }
.sides span { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; border: 2px solid var(--line); font-weight: 700; color: var(--muted); }
.sides .cur { border-color: var(--accent); color: var(--ink); }
.sides .done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rest-time { font-size: 120px; margin: 24px 0 10px; }
.rest-bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.rest-bar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.next-up { margin-top: 26px; padding: 14px; background: var(--surface); border-left: 5px solid var(--accent); }
.next-up .n { font-weight: 700; font-size: 20px; }
.check { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 0; border-bottom: 1px solid var(--line); }
.check .box { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--ink); flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check b { display: block; }
.res { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.res .r { text-align: right; color: var(--ink2); }
.up-banner { margin: 14px 0 6px; padding: 14px; background: var(--lvl); color: var(--lvl-ink); font-weight: 700; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 40; font-weight: 600; }
.empty { padding: 18px 0; color: var(--muted); }
/* Animações suaves */
@media (hover: hover) {
  .btn.tape:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 0 var(--accent-deep); }
  .btn.ghost:hover, .w-links button:hover, .sides span:hover { background: var(--surface); transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .w-x:hover, .big-stepper button:hover { background: var(--surface); transform: translateY(-1px); }
  .ex:hover, .row-btn:hover { filter: brightness(1.08); }
}
.btn.tape:active, .btn.ghost:active { transform: translateY(3px) !important; }
button, .btn, .w-links button, .sides span { transition: transform .12s ease, box-shadow .12s ease, background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease; }
button:active { transform: scale(.97); }
.btn.tape:active, .w-links button:active { transform: translateY(3px); }
.w-segs i, .w-prog i { transition: background-color .35s ease, width .25s linear; }
.w-segs i.cur { animation: segIn .4s ease; }
@keyframes segIn { from { transform: scaleY(.3); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes enterUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay.enter .w-body { animation: enterUp .3s ease both; }
.view-enter { animation: enterUp .25s ease both; }
.sheet-bg { animation: fadeIn .2s ease; }
.sheet { animation: sheetUp .28s ease; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.w-target.sm .num { font-size: 60px; }
.how { margin: 14px 0 18px; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
.how li { padding: 11px 0; border-bottom: 1px solid var(--line); }
.w-links a { color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }

.vid-box { margin: 10px 0 4px; }
.vid { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(100deg, #1b2128 30%, #2a323b 50%, #1b2128 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; border-radius: 10px; overflow: hidden; padding: 0; }
.vid img, .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
.vid iframe { opacity: 0; transition: opacity .4s ease; }
.vid iframe.ok { opacity: 1; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.vid .play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--accent); }
.vid .play::after { content: ''; position: absolute; left: 25px; top: 19px; border-left: 20px solid var(--accent-ink); border-top: 13px solid transparent; border-bottom: 13px solid transparent; }
.vid-cap { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.vid-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 600; }

.del-sess { margin: 10px 0 4px; min-height: 48px; color: var(--ink); }

/* Tela do treino: tudo numa página, sem rolagem. O vídeo ocupa o espaço que sobra. */
.w-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.w-row { display: flex; align-items: center; gap: 8px; }
.w-row .w-count { white-space: nowrap; }
.w-body { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
.w-name { font-size: clamp(30px, 9vw, 40px); margin: 4px 0 2px; }
.w-target { margin: 8px 0 2px; }
.w-target .num { font-size: clamp(48px, 15vw, 68px); }
.w-cue { margin: 6px 0 8px; padding: 7px 12px; font-size: 15px; }
.big-stepper { margin-bottom: 8px; }
.big-stepper button { width: 60px; height: 60px; font-size: 30px; }
.big-stepper .val { font-size: 48px; }
.sides { margin: 8px 0 4px; }
.swap { margin-top: 8px; }
.swap .pathsel { margin-top: 6px; }
.swap .pathsel button, .vid-keep .pathsel button { padding: 7px 10px; font-size: 14px; }
.w-body .vid-keep { flex: 1 1 0; min-height: 100px; display: flex; flex-direction: column; margin-top: 8px !important; }
.vid-keep .vid-wrap, .vid-keep .vid-slot, .vid-keep .vid-box { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.vid-keep .vid-box { margin: 6px 0 0; }
.vid-keep .vid { flex: 1; min-height: 0; aspect-ratio: auto; width: 100%; max-height: min(56.25vw, 292px); }
.vid-keep .vid-cap { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-links { margin-top: 8px; gap: 8px; flex-wrap: nowrap; }
.w-links button { flex: 1 1 0; min-width: 0; padding: 0 8px; font-size: 15px; }
.rest-time { font-size: clamp(72px, 22vw, 104px); margin: 8px 0 4px; }
.next-up { margin-top: 12px; padding: 10px 12px; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.next-up .vid-keep { margin-top: 6px !important; }
.big-stepper button { font-size: 24px; font-weight: 700; }

/* Treino de hoje já feito, e treinos recentes na tela Today */
.done-card { display: flex; align-items: center; gap: 14px; padding: 14px; margin: 6px 0 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); }
.done-card b { font-size: 18px; }
.done-card p { margin: 2px 0 0; font-size: 15px; }
.done-ico { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
.recent-list { border-top: 2px solid var(--ink); }
.recent { display: flex; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; }
.link-more { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 600; }

.daysel { display: flex; gap: 8px; margin: 22px 0 0; }
.daysel button { flex: 1; min-height: 44px; padding: 0 6px; border-radius: 10px; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); font-weight: 700; font-size: 15px; white-space: nowrap; }
.daysel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); color: var(--accent-ink); }
.daysel + .sec-title { margin-top: 18px; }

/* Redesenho das telas Today e Progress: cartões, cabeçalho com a semana, abas */
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head-row .week { margin: 0; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 4px; }
.hero { padding: 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
.hero-text { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
.hero .done-card { border: 0; background: none; padding: 0; margin: 0 0 14px; }
.hero-last { margin-top: 12px; text-align: center; }
.daysel { margin: 22px 0 0; }
.plan-head { margin: 16px 0 2px; }
.plan-head h2 { font-stretch: 80%; font-weight: 700; font-size: 22px; }
.plan-head p { margin-top: 2px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px; margin-top: 14px; }
.gcard.pad { padding: 14px 16px 12px; }
.gcard .grp { margin: 14px 0 4px; }
.gcard .ex-list { border-top: 2px solid var(--ink); }
.gcard .ex:last-child { border-bottom: 0; }
.gcard .pcard-top { padding-top: 0; }
.card-title { font-weight: 700; font-size: 18px; }
.segsel { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.segsel button { flex: 1; min-height: 44px; border-radius: 9px; text-align: center; font-weight: 700; color: var(--muted); }
.segsel button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stats { display: flex; gap: 10px; margin-top: 14px; }
.stat { flex: 1; padding: 12px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
.stat b { display: block; font-size: 34px; }
.stat span { font-size: 13px; color: var(--muted); }
.tab-note { margin-top: 14px; }
.gcard details.sess:last-child { border-bottom: 0; }
.gcard details.sess:first-child { padding-top: 14px; }

.big-stepper button[disabled] { opacity: .35; }

/* Grupos de opções (Settings, folha do exercício, trocas): mesmo desenho dos botões de dia da tela Today */
.pathsel button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); font-weight: 700; font-size: 15px; text-align: center; }
.pathsel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); color: var(--accent-ink); font-weight: 700; }
.swap .pathsel button, .vid-keep .pathsel button { padding: 0 10px; font-size: 14px; min-height: 40px; }

.pathsel button:active, .daysel button:active, .stepper button:active, .big-stepper button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.pathsel button[aria-pressed="true"]:active, .daysel button[aria-pressed="true"]:active { box-shadow: 0 0 0 var(--accent-deep); }

  .pathsel button:hover, .daysel button:hover, .stepper button:hover, .big-stepper button:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .pathsel button[aria-pressed="true"]:hover, .daysel button[aria-pressed="true"]:hover { box-shadow: 0 5px 0 var(--accent-deep); }

.stepper button, .big-stepper button { box-shadow: 0 3px 0 var(--line); }

.switch[aria-checked="true"] { box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); }
.switch:active::after { width: 28px; }
.switch[aria-checked="true"]:active::after { transform: translateX(20px); }

/* Abas do Progress: botões separados, como os botões de dia */
.segsel { gap: 8px; padding: 0; background: none; border: 0; border-radius: 0; }
.segsel button { border-radius: 10px; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); color: var(--ink); font-size: 15px; }
.segsel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); color: var(--accent-ink); }

/* Escada de progressão: cada degrau é um botão com profundidade */
.ladder { border-top: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ladder button { min-height: 48px; padding: 0 14px; border: 2px solid var(--line); border-bottom-width: 2px; border-radius: 10px; box-shadow: 0 3px 0 var(--line); }
.ladder .cur { background: var(--accent); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); color: var(--accent-ink); }
.ladder .cur .mark { background: var(--accent-ink); border-color: var(--accent-ink); }

.ladder button[disabled] { cursor: default; }

.segsel button:active, .ladder button:not([disabled]):active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.segsel button[aria-pressed="true"]:active, .ladder .cur:active { box-shadow: 0 0 0 var(--accent-deep); }
@media (hover: hover) {
  .segsel button:hover, .ladder button:not([disabled]):hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .segsel button[aria-pressed="true"]:hover, .ladder .cur:not([disabled]):hover { box-shadow: 0 5px 0 var(--accent-deep); }
  .segsel button:active, .ladder button:not([disabled]):active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
}

/* Linhas que abrem algo: cada uma é um cartão com profundidade, no mesmo estilo dos botões */
.plan-grp { margin-top: 22px; }
.plan-grp .grp { margin: 0 0 10px; }
.plan-grp .ex-list, .sess-list { border-top: 0; display: flex; flex-direction: column; gap: 10px; }
.sess-list { margin-top: 14px; }
.plan-grp .ex, details.sess { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); padding: 12px 36px 13px 14px; }
.plan-grp .ex::after, details.sess summary::after { content: ''; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -5px; border-right: 2.5px solid var(--accent); border-top: 2.5px solid var(--accent); transform: rotate(45deg); }
.plan-grp .ex:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
details.sess { padding: 0 14px; }
details.sess summary { position: relative; align-items: center; min-height: 54px; padding-right: 26px; }
details.sess summary::after { right: 2px; transition: transform .2s ease; }
details.sess[open] summary::after { transform: rotate(135deg); margin-top: -8px; }
details.sess[open] { padding-bottom: 12px; }
details.sess summary:active { opacity: .7; }
@media (hover: hover) {
  .plan-grp .ex:hover, details.sess:hover { filter: none; transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .plan-grp .ex:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
}

/* Barra de abas: ícone e nome, e a aba atual em destaque suave (inspirada nas barras de apps como o Duolingo) */
.tabbar { gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; margin-top: 0; padding: 7px 0 6px; border: 2px solid transparent; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab-ico { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tab:active { transform: scale(.94); }
.tab-ico { transition: transform .2s ease; }
.tab[aria-current="page"] .tab-ico { transform: translateY(-1px) scale(1.08); }
.sheet-bg { touch-action: none; }
.sheet { overscroll-behavior: contain; }
html.no-scroll { overflow: hidden; }

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function isoDate(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function dayDiff(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
function weekStartISO(s) {
  var d = parseISO(s);
  var dow = (d.getUTCDay() + 6) % 7; /* segunda = 0 */
  d.setUTCDate(d.getUTCDate() - dow);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

function defaultState(D) {

  return { v: 1, settings: { hasBar: false, hasDip: false, restMain: 90, restCore: 60 }, levels: levels, sessions: [] };
}

function ladderOf(D, state, slot) {

  var path = D.LADDERS[slot].paths[L.path] || D.LADDERS[slot].paths[D.LADDERS[slot].defaultPath];
  return path.levels;
}

  var lad = ladderOf(D, state, slot);
  var idx = Math.max(0, Math.min(lad.length - 1, state.levels[slot].idx));
  return lad[idx];
}

  if (D.SLOTS[slot].needsBar && !state.settings.hasBar) return false;
  if (D.SLOTS[slot].needsDip && !state.settings.hasDip) return false;
  return true;
}

/* Última sessão em que este exercício foi feito neste nível, com pelo menos uma série. */
function lastEntry(state, slot, levelId) {
  var best = null;
  for (var i = 0; i < state.sessions.length; i++) {
    var e = state.sessions[i].entries && state.sessions[i].entries[slot];
    if (!e || e.levelId !== levelId || !e.sets || !e.sets.length) continue;
    if (!best || state.sessions[i].date >= best.date) best = { date: state.sessions[i].date, entry: e };
  }
  return best;
}

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

/* Meta de cada uma das 3 séries.
   Primeira vez no nível: tudo no mínimo. Depois: se bateu todas as metas, sobe um degrau por série
   (1 repetição, ou 5 s nos holds); senão repete o que fez. Nunca passa do máximo da faixa. */
function targetsFor(level, last) {
  var n = 3, out = [], i;
  if (!last) { for (i = 0; i < n; i++) out.push(level.lo); return out; }
  var e = last.entry, clean = e.sets.length >= n;
  for (i = 0; i < Math.min(n, e.sets.length); i++) {
    if (e.targets && e.sets[i] < e.targets[i]) clean = false;
  }
  for (i = 0; i < n; i++) {
    var base = i < e.sets.length ? e.sets[i] : (e.targets && e.targets[i] != null ? e.targets[i] : level.lo);
    out.push(clamp(clean ? base + level.step : base, level.lo, level.hi));

}

function prescribe(D, state, slot) {
  var level = currentLevel(D, state, slot);
  var last = lastEntry(state, slot, level.id);
  return { slot: slot, level: level, targets: targetsFor(level, last), first: !last, last: last };
}

  if (!sets || sets.length < 3) return false;
  for (var i = 0; i < sets.length; i++) if (sets[i] < level.hi) return false;

function buildSteps(D, state) {

    var act = slots.filter(function (s) { return isActive(D, state, s); });
    for (var set = 1; set <= 3; set++) act.forEach(function (s) { steps.push({ slot: s, set: set, group: kind }); });
  }
  D.PAIRS.forEach(function (p, i) { group(p, 'p' + (i + 1)); });
  group(D.CORE, 'core');
  return steps;
}

    var lad = ladderOf(D, state, slot);
    var idx = -1;
    for (var i = 0; i < lad.length; i++) if (lad[i].id === l.levelId) idx = i;
    if (idx < 0) return;

    if (mastered(level, e.sets) && idx < lad.length - 1) {
      e.promotedTo = lad[idx + 1].name;

      promotions.push({ slot: slot, from: level.name, to: lad[idx + 1].name });

    id: 's' + date + '-' + (W.startedAt || Date.now()),

  state.sessions.push(session);
  state.sessions.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); });

function weeklyCounts(sessions, nWeeks, todayStr) {
  var start = weekStartISO(todayStr);
  var weeks = [];
  for (var i = nWeeks - 1; i >= 0; i--) {
    var d = parseISO(start); d.setUTCDate(d.getUTCDate() - 7 * i);
    weeks.push({ start: d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()), n: 0 });
  }
  sessions.forEach(function (s) {
    var ws = weekStartISO(s.date);
    for (var j = 0; j < weeks.length; j++) if (weeks[j].start === ws) weeks[j].n++;
  });
  return weeks;
}

/* Série de métrica por sessão para um exercício: total de repetições ou segundos. */
function seriesFor(state, slot) {
  var out = [];
  state.sessions.forEach(function (s) {
    var e = s.entries && s.entries[slot];
    if (!e || !e.sets || !e.sets.length) return;
    var tot = 0; e.sets.forEach(function (x) { tot += x; });
    out.push({ date: s.date, total: tot, sets: e.sets, name: e.name, kind: e.kind, promoted: !!e.promotedTo, promotedTo: e.promotedTo || '' });
  });
  return out;
}

function scheduleHint(sessions, todayStr) {
  var last = null;
  sessions.forEach(function (s) { if (!last || s.date > last) last = s.date; });
  var dow = (parseISO(todayStr).getUTCDay() + 6) % 7; /* seg = 0 */
  var gap = last ? dayDiff(todayStr, last) : null;
  if (gap === 0) return { kind: 'done', text: 'You already trained today.' };
  if (gap === 1) return { kind: 'rest', text: 'You trained yesterday. The guide asks for at least one day between workouts.' };
  if (dow === 0 || dow === 2 || dow === 4) return { kind: 'go', text: 'Today is a full routine day.' };

  if (obj.levels) Object.keys(obj.levels).forEach(function (k) { if (state.levels[k] && obj.levels[k]) state.levels[k] = obj.levels[k]; });

    sync.err = true; sync.note = 'Could not save to your account (' + ((e && e.code) || 'error') + '). Your data stays on this device.';

function barChart(items, o) {

      '<text x="' + (x + bw / 2) + '" y="' + (Ht - 2) + '" text-anchor="middle">' + esc(it.label) + '</text></g>';

      '<p class="w-sub">Item ' + (wi + 1) + ' of ' + items.length + '</p><div class="w-target"><span class="num">' + esc(it.n) + '</span><span>' + esc(it.unit) + '</span></div>' +
      it.how.map(function (t) { return '<p class="w-cue">' + esc(t) + '</p>'; }).join('') + timerBox + main + warmSwap(it) +
      (it.q ? '<div class="vid-keep" style="margin-top:16px">' + videoHtml('w.' + it.id, it.q) + '</div>' : '') +
      '<div class="w-links">' + (wi > 0 ? '<button data-act="w-warm-back">Back</button>' : '') + '<button data-act="w-warm-skip" aria-label="Skip this item">Skip</button><button data-act="w-begin" aria-label="Skip warm-up">Skip all</button><button data-act="w-finish-ask" aria-label="Finish workout">Finish</button></div></div>';
  } else if (W.phase === 'set') {
    var st = curStep(), lvl = levelOfStep(st), S = SLOTS[st.slot], L = W.logged[st.slot], tg = L.targets[st.set - 1];
    var pct = 100 * W.i / W.steps.length;
    var pips = [1, 2, 3].map(function (n) { return '<i class="' + (n < st.set ? 'done' : n === st.set ? 'cur' : '') + '"></i>'; }).join('');
    var unit = lvl.kind === 'hold' ? 'seconds' : 'reps';
    if (lvl.perSide) unit += ' per side';
    var doneLabel = lvl.perSide ? (W.side ? 'Left side done' : 'Right side done') : 'Set done';
    var sidesHtml = lvl.perSide ? '<div class="sides" aria-label="Sides"><span class="' + (W.side ? 'done' : 'cur') + '">Right side</span><span class="' + (W.side ? 'cur' : '') + '">Left side</span></div><p class="muted small">Do one side, then the other. Both sides count as one set.</p>' : '';
    var input;
    if (lvl.kind === 'hold') {
      input = (W.holdStart ? '<div class="big-stepper"><button data-act="w-hold-adj" data-d="-20" aria-label="Minus 20 seconds">−20</button><span class="val num" id="holdTime">' + timerText(holdGoal(), (Date.now() - W.holdStart) / 1000) + '</span><button data-act="w-hold-adj" data-d="20" aria-label="Plus 20 seconds">+20</button></div><button class="btn tape" data-act="w-hold-stop">Stop</button>' :
        '<div class="big-stepper"><button data-act="w-val" data-d="-20" aria-label="Minus 20 seconds">−20</button><span class="val num" id="val">' + W.value + ' s</span><button data-act="w-val" data-d="20" aria-label="Plus 20 seconds">+20</button></div>' +
        '<div class="btn-row" style="margin-top:0"><button class="btn ghost" data-act="w-hold-start">Start timer</button><button class="btn tape" data-act="w-log">' + doneLabel + '</button></div>');
    } else {
      input = '<div class="big-stepper"><button data-act="w-val" data-d="-1" aria-label="Minus one rep">−1</button><span class="val num" id="val">' + W.value + '</span><button data-act="w-val" data-d="1" aria-label="Plus one rep">+1</button></div><button class="btn tape" data-act="w-log">' + doneLabel + '</button>';
    }
    var ssub = '';
    body = topFor(ssub) + '<div class="w-body"><p class="w-group">' + groupLabel(st) + ' · ' + esc(S.label) + '</p><h1 class="w-name">' + esc(lvl.name) + '</h1><p class="w-sub">Set ' + st.set + ' of 3</p>' +
      sidesHtml + '<div class="w-target"><span class="num">' + tg + '</span><span>' + unit + ' target</span></div><p class="w-cue">' + esc(lvl.cues[0] || (S.general && S.general[0]) || '') + '</p>' + input + '<div class="vid-keep" style="margin-top:16px">' + vidBlock(lvl) + '</div>' +
      '<div class="w-links"><button data-act="w-back">Back</button><button data-act="w-info">How to</button><button data-act="w-skip" aria-label="Skip exercise">Skip</button><button data-act="w-finish-ask" aria-label="Finish workout">Finish</button></div></div>';
  } else if (W.phase === 'rest') {
    var st2 = curStep(), n = nextIndex(W.i + 1), pct2 = 100 * (W.i + 1) / W.steps.length;
    var nextHtml = '';
    if (n >= 0) {
      var ns = W.steps[n], nl = levelOfStep(ns), nt = W.logged[ns.slot].targets[ns.set - 1];
      nextHtml = '<div class="next-up"><span class="muted small">Up next</span><div class="n">' + esc(nl.name) + '</div><span class="muted">Set ' + ns.set + ' of 3 · target ' + nt + (nl.kind === 'hold' ? ' s' : ' reps') + (nl.perSide ? ' per side' : '') + '</span>' + '<div class="vid-keep" style="margin-top:12px">' + vidBlock(nl) + '</div>' + '</div>';
    }
    var rrem = (W.restEnd - Date.now()) / 1000;
    body = topFor(subTime(fmtClock(rrem), 100 * (1 - rrem / W.restTotal))) + '<div class="w-body"><p class="w-group">Rest</p><div class="rest-time num" id="restTime">' + fmtClock((W.restEnd - Date.now()) / 1000) + '</div>' +
      '<div class="btn-row" style="margin-top:18px"><button class="btn ghost" data-act="w-rest-add">+ 15 s</button><button class="btn tape" data-act="w-rest-skip">Skip</button></div>' + nextHtml + '<div class="w-links"><button data-act="w-back">Back</button><button data-act="w-finish-ask" aria-label="Finish workout">Finish</button></div></div>';
  } else if (W.phase === 'summary') {
    var r = W.result, mins = Math.max(1, Math.round(r.session.durationSec / 60));
    var rows = SLOT_ORDER.filter(function (k) { return r.session.entries[k]; }).map(function (k) {
      var e = r.session.entries[k];
      return '<div class="res"><span>' + esc(e.name) + '</span><span class="r">' + esc(sessionSummaryText(e)) + '</span></div>';
    }).join('');
    var ups = r.promotions.map(function (p) { return '<div class="up-banner">Level up: ' + esc(p.from) + ' → ' + esc(p.to) + '. Next time, start at 3 × 5.</div>'; }).join('');
    body = top('', 100) + '<div class="w-body"><h1 class="w-name">Workout complete</h1><p class="w-sub">' + mins + ' min · ' + Object.keys(r.session.entries).length + ' exercises</p>' + ups +
      '<div style="margin-top:14px;border-top:2px solid var(--ink)">' + (rows || '<p class="empty">No sets logged.</p>') + '</div>' +
      '<div style="margin-top:auto;padding-top:22px"><button class="btn tape" data-act="w-close">Close</button></div></div>';
  }
  /* Mantém o iframe do vídeo entre renders (se o vídeo é o mesmo), para ele não recarregar a cada toque. */
  var oldK = ov.querySelector('.vid-keep'), oldBody = ov.querySelector('.w-body');
  var key = W.phase + ':' + W.i + ':' + (W.side || 0), scr = oldBody && oldBody.scrollTop;
  var tmp = document.createElement('div');
  tmp.innerHTML = '<div class="overlay" role="region" aria-label="Workout in progress">' + body + '</div>';
  var newK = tmp.querySelector('.vid-keep'), oF = oldK && oldK.querySelector('iframe'), nF = newK && newK.querySelector('iframe');
  if (oF && nF && oF.getAttribute('src') === nF.getAttribute('src') && oldK.parentNode.className === 'w-body' && newK.parentNode.className === 'w-body') {
    /* Mesmo vídeo: troca tudo em volta dele, sem mexer no iframe (mover um iframe recarrega o vídeo). */
    var ob = oldK.parentNode, nb = newK.parentNode;
    ov.querySelector('.w-head').replaceWith(tmp.querySelector('.w-head'));
    while (ob.firstChild !== oldK) ob.removeChild(ob.firstChild);
    while (oldK.nextSibling) ob.removeChild(oldK.nextSibling);
    while (nb.firstChild !== newK) ob.insertBefore(nb.firstChild, oldK);
    while (newK.nextSibling) ob.appendChild(newK.nextSibling);
  } else {
    if (key !== lastKey) tmp.firstChild.classList.add('enter');
    ov.innerHTML = ''; ov.appendChild(tmp.firstChild);
    var nbody = ov.querySelector('.w-body');
    if (nbody && scr && key === lastKey) nbody.scrollTop = scr;
  }
  lastKey = key;
  document.body.classList.add('no-scroll');
}
function logSet() {
  var st = curStep(), L = W.logged[st.slot];
  L.sets[st.set - 1] = W.value;
  var n = nextIndex(W.i + 1);
  if (n < 0) { finishNow(); return; }
  var secs = restSeconds(D, state, st.slot);
  W.phase = 'rest'; W.restTotal = secs; W.restEnd = Date.now() + secs * 1000; W.holdStart = null;
  saveDraft(); renderWorkout();
}
function finishNow() {
  var warmDone = Object.keys(W.warm).filter(function (k) { return W.warm[k]; }).length;
  W.warmDone = warmDone;
  var dur = Math.round((Date.now() - W.startedAt) / 1000);
  var anySets = Object.keys(W.logged).some(function (k) { return W.logged[k].sets.length; });
  var res = finishWorkout(D, state, W, isoDate(), dur);
  if (anySets) { persistSession(res.session); persistProfile(); } else { state.sessions = state.sessions.filter(function (s) { return s.id !== res.session.id; }); }
  clearDraft(); stopTick();
  W.phase = 'summary'; W.result = res; renderWorkout();
}
function closeWorkout() { W = null; stopTick(); $('#overlay').innerHTML = ''; document.body.classList.remove('no-scroll'); closeSheet(); render(); }

/* ---------- Eventos ---------- */
var H = {
  'tab': function (el) { tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  'start': function () { startWorkout(); },
  'resume': function () { resumeWorkout(); },
  'discard-draft': function () { clearDraft(); render(); },
  'open-ex': function (el) { openSheet(el.dataset.slot, 'home', el.dataset.lvl); },
  'pick-day': function (el) { dayIdx = +el.dataset.i; render(); },
  'prog-tab': function (el) { progTab = el.dataset.p; render(); window.scrollTo(0, 0); },
  'open-warm': function (el) { openWarm(el.dataset.id); },
  'vid-tab': function (el) {
    el.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === el ? 'true' : 'false'); });
    el.closest('.vid-wrap').querySelector('.vid-slot').innerHTML = videoHtml(el.dataset.key, el.dataset.q);
  },
  'warm-swap': function (el) {
    var m = state.settings.warmAlt || (state.settings.warmAlt = {});
    if (el.dataset.alt) m[el.dataset.base] = el.dataset.alt; else delete m[el.dataset.base];
    persistProfile(); renderWorkout();
  },
  'sheet-close': function () { closeSheet(); },
  'pick-level': function (el) {
    var slot = el.dataset.slot, i = +el.dataset.i;
    state.levels[slot].idx = i; persistProfile();
    if (W && sheetCtx && sheetCtx.ctx === 'workout') {
      var p = prescribe(D, state, slot); W.logged[slot] = { levelId: p.level.id, sets: [], targets: p.targets };
      if (W.phase === 'set' && curStep().slot === slot) setDefault();
      saveDraft(); renderWorkout();
    } else render();
    renderSheet();
  },
  'set-path': function (el) {
    var slot = el.dataset.slot, path = el.dataset.path;
    if (state.levels[slot].path !== path) { state.levels[slot] = { path: path, idx: 0 }; persistProfile(); }
    render(); renderSheet();
  },
  'toggle-dip': function () { state.settings.hasDip = !state.settings.hasDip; persistProfile(); render(); toast(state.settings.hasDip ? 'Dip added to your workout' : 'Dip left out of your workout'); },
  'toggle-bar': function () { state.settings.hasBar = !state.settings.hasBar; persistProfile(); render(); toast(state.settings.hasBar ? 'Pull-up added to your workout' : 'Pull-up left out of your workout'); },
  'rest-main': function (el) { state.settings.restMain = Math.max(30, Math.min(300, state.settings.restMain + 15 * +el.dataset.d)); persistProfile(); $('#rm').textContent = state.settings.restMain + ' s'; },
  'rest-core': function (el) { state.settings.restCore = Math.max(30, Math.min(300, state.settings.restCore + 15 * +el.dataset.d)); persistProfile(); $('#rc').textContent = state.settings.restCore + ' s'; },
  'copy-bk': function () {
    var ta = $('#bk'); ta.focus(); ta.select();
    var done = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(function () { toast('Backup copied'); }, function () { toast('Text selected, copy it manually'); }); done = true; } } catch (e) { }
    if (!done) toast('Text selected, copy it manually');
  },
  'import-bk': function () {
    try {
      var o = JSON.parse($('#bk').value);
      if (!o || !o.sessions || !o.levels) throw new Error('formato');
      var before = state.sessions.length;
      mergeLoaded(o, null);
      persistProfile(); state.sessions.forEach(function (s) { persistSession(s); });
      render(); toast((state.sessions.length - before) + ' workouts imported');
    } catch (e) { toast('Invalid backup. Paste the full text.'); }
  },
  'sess-del-ask': function (el) {
    var s = state.sessions.filter(function (x) { return x.id === el.dataset.id; })[0];
    var promoted = s && Object.keys(s.entries).some(function (k) { return s.entries[k].promotedTo; });
    confirmBox('Delete this workout?', 'It is removed from your history and the next targets are recalculated.' + (promoted ? ' Level-ups it caused stay.' : '') + ' This cannot be undone.', [{ label: 'Delete workout', act: 'sess-del-do', id: el.dataset.id }, { label: 'Cancel', act: 'sheet-close', cls: 'ghost' }]);
  },
  'sess-del-do': function (el) {
    state.sessions = state.sessions.filter(function (x) { return x.id !== el.dataset.id; });
    persistProfile(); if (dbRefs) enqueue(function () { return dbRefs.sessions.doc(el.dataset.id).delete(); });
    closeSheet(); render(); toast('Workout deleted');
  },
  'reset-ask': function () { confirmBox('Delete everything?', 'Your logged workouts are deleted and the levels go back to the start. This cannot be undone.', [{ label: 'Delete everything', act: 'reset-do' }, { label: 'Cancel', act: 'sheet-close', cls: 'ghost' }]); },
  'reset-do': function () {
    var keepBar = state.settings.hasBar, keepDip = state.settings.hasDip; state = defaultState(D); state.settings.hasBar = keepBar; state.settings.hasDip = keepDip;
    persistProfile(); if (dbRefs) { /* sessões antigas ficam na conta, mas não aparecem mais após limpar: apaga uma a uma */ dbRefs.sessions.get().then(function (sn) { sn.docs.forEach(function (d) { enqueue(function () { return dbRefs.sessions.doc(d.id).delete(); }); }); }, function () { }); }
    closeSheet(); render(); toast('Everything deleted');
  },
  'bar': function (el) {
    var box = el.closest('.chart-box'); if (!box) return;
    box.querySelectorAll('.bar').forEach(function (b) { b.classList.remove('sel'); });
    el.classList.add('sel'); box.querySelector('.chart-cap').textContent = el.getAttribute('data-cap');
  },
  /* treino */
  'w-exit': function () {
    var any = Object.keys(W.logged).some(function (k) { return W.logged[k].sets.length; });
    confirmBox('Leave workout?', any ? 'You can save what you did or continue later where you stopped.' : 'You have not logged any set yet.', [
      { label: 'Continue workout', act: 'sheet-close', cls: 'tape' }].concat(any ? [{ label: 'Save and finish', act: 'w-finish', cls: 'ghost' }] : []).concat([
      { label: any ? 'Leave and continue later' : 'Leave workout', act: 'w-leave', cls: 'ghost' }, { label: 'Discard workout', act: 'w-discard', cls: 'ghost' }]));
  },
  'w-leave': function () { saveDraft(); W = null; stopTick(); $('#overlay').innerHTML = ''; document.body.classList.remove('no-scroll'); closeSheet(); render(); },
  'w-discard': function () { clearDraft(); W = null; stopTick(); $('#overlay').innerHTML = ''; document.body.classList.remove('no-scroll'); closeSheet(); render(); },
  'w-finish-ask': function () { H['w-exit'](); },
  'w-finish': function () { closeSheet(); finishNow(); },
  'w-warm-next': function () { var it = warmupItems(D, state)[W.warmI || 0]; if (it) W.warm[it.id] = true; doneChime(); warmGo(1); },
  'w-warm-skip': function () { warmGo(1); },
  'w-warm-back': function () { warmGo(-1); },
  'w-warm-timer': function () { prepAudio(); var it = warmupItems(D, state)[W.warmI || 0]; W.warmEnd = Date.now() + (it.secs + 3) * 1000; W.warmTotal = it.secs; lastCue = null; saveDraft(); renderWorkout(); },
  'w-warm-adj': function (el) {
    var it = warmupItems(D, state)[W.warmI || 0], g = warmGoal(it), d = +el.dataset.d, el2 = g - (W.warmEnd - Date.now()) / 1000;
    if (el2 < 0) return;
    var ng = Math.max(5, g + d); if (ng <= el2 + 1) return;
    W.warmEnd += (ng - g) * 1000; W.warmTotal = ng; saveDraft(); renderWorkout();
  },
  'w-hold-adj': function (el) {
    var g = holdGoal(), d = +el.dataset.d, e = (Date.now() - W.holdStart) / 1000;
    if (e < 0) return;
    var ng = Math.max(5, g + d); if (ng <= e + 1) return;
    W.holdTotal = ng; saveDraft(); renderWorkout();
  },
  'w-begin': function () { var n = nextIndex(0); if (n < 0) { finishNow(); return; } goSet(n); },
  'w-val': function (el) {
    var st = curStep(), lvl = levelOfStep(st), d = +el.dataset.d;
    W.value = Math.max(0, W.value + d); saveDraft();
    $('#val').textContent = W.value + (lvl.kind === 'hold' ? ' s' : '');
  },
  'w-back': function () {
    var from = W.phase === 'rest' ? W.i : W.i - 1, p = -1;
    for (var k = from; k >= 0; k--) if (W.skipped.indexOf(W.steps[k].slot) < 0) { p = k; break; }
    if (p < 0) {
      var wi = warmupItems(D, state).length - 1;
      W.phase = 'warmup'; W.warmI = Math.max(0, wi); W.warmEnd = 0; W.holdStart = null; saveDraft(); renderWorkout(); return;
    }
    var ps = W.steps[p], L = W.logged[ps.slot], prev = L.sets[ps.set - 1];
    L.sets.length = Math.min(L.sets.length, ps.set - 1);
    W.i = p; W.phase = 'set'; setDefault();
    if (prev != null) W.value = prev;
    saveDraft(); renderWorkout();
  },
  'w-hold-start': function () { prepAudio(); W.holdTotal = Math.max(1, W.value || 0); W.holdStart = Date.now() + 3000; lastCue = null; saveDraft(); renderWorkout(); },
  'w-hold-stop': function () { var cap = holdGoal(); var el = (Date.now() - W.holdStart) / 1000; if (el > 0) W.value = Math.min(cap, Math.max(1, Math.round(el))); W.holdStart = null; saveDraft(); renderWorkout(); },
  'w-log': function () {
    var st = curStep(), lvl = levelOfStep(st);
    doneChime();
    if (lvl.perSide) {
      if (!W.side) { W.right = W.value; W.side = 1; W.value = W.logged[st.slot].targets[st.set - 1]; W.holdStart = null; if (lvl.kind === 'hold') autoStartHold(5); saveDraft(); renderWorkout(); return; }
      W.value = Math.min(W.right == null ? W.value : W.right, W.value);
    }
    logSet();
  },
  'w-rest-add': function () { W.restEnd += 15000; W.restTotal += 15; saveDraft(); },
  'w-rest-skip': function () { var n = nextIndex(W.i + 1); if (n >= 0) goSet(n); else finishNow(); },
  'w-info': function () { openSheet(curStep().slot, 'workout'); },
  'w-skip': function () {
    var st = curStep(); W.skipped.push(st.slot);
    var n = nextIndex(W.i + 1); if (n >= 0) { toast(SLOTS[st.slot].label + ' skipped today'); goSet(n); } else finishNow();
  },
  'w-close': function () { closeWorkout(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var f = H[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#sheet').innerHTML) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('data-act') === 'bar') { e.preventDefault(); H.bar(e.target); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && W) { prepAudio(); tick(); } });

(async function boot() {
  render();
  await initStorage();
  var d = loadDraft();
  render();
})();

</script>
</body>
